version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: vigan-booking-app:latest
    container_name: vigan_booking_app
    restart: always
    mem_limit: 1g
    cpus: 0.5
    ports:
      - "${HOST_PORT:-3001}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3000
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 1g
    volumes:
      - app_data:/app/data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  app_data:
    driver: local
